<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ── Token system ─────────────────────────────────── */
    :root {
      --bg:        #F5F6F8;
      --surface:   #FFFFFF;
      --fg:        #1C1F26;
      --fg-mid:    #4B5163;
      --fg-muted:  #8A919F;
      --accent:    #2E54C8;
      --accent-bg: #EEF2FC;
      --rule:      #DDE1E8;
      --sidebar-w: 210px;

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'Jost', system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:        #0D0F14;
        --surface:   #13161D;
        --fg:        #DFE3EC;
        --fg-mid:    #9BA3B5;
        --fg-muted:  #5C6477;
        --accent:    #7B9DF8;
        --accent-bg: #131A2E;
        --rule:      #1F242F;
      }
    }

    :root[data-theme="dark"] {
      --bg:        #0D0F14;
      --surface:   #13161D;
      --fg:        #DFE3EC;
      --fg-mid:    #9BA3B5;
      --fg-muted:  #5C6477;
      --accent:    #7B9DF8;
      --accent-bg: #131A2E;
      --rule:      #1F242F;
    }

    /* ── Reset ────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 19px;
      line-height: 1.75;
      min-height: 100%;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    img { max-width: 100%; display: block; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

    /* ── Shell ────────────────────────────────────────── */
    .shell { display: flex; min-height: 100vh; }

    /* ── Sidebar ──────────────────────────────────────── */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      width: var(--sidebar-w);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 48px 28px 40px;
      border-right: 1px solid var(--rule);
      background: var(--surface);
      overflow-y: auto;
    }

    .sidebar-brand { margin-bottom: 44px; }

    .brand-mark {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--accent);
      display: block;
      margin-bottom: 8px;
      opacity: 0.8;
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 23px;
      font-weight: 500;
      line-height: 1.2;
      color: var(--fg);
    }

    .brand-title {
      font-size: 11px;
      font-weight: 400;
      color: var(--fg-muted);
      letter-spacing: 0.07em;
      text-transform: uppercase;
      margin-top: 7px;
    }

    nav { flex: 1; }

    nav ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }

    nav a {
      display: block;
      padding: 7px 0;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--fg-muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    nav a:hover { color: var(--fg-mid); }
    nav a.active { color: var(--accent); }

    .sidebar-footer { padding-top: 24px; border-top: 1px solid var(--rule); }

    .theme-toggle {
      background: none;
      border: 1px solid var(--rule);
      color: var(--fg-muted);
      border-radius: 3px;
      padding: 5px 11px;
      font-size: 10px;
      font-family: var(--font-body);
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .theme-toggle:hover { border-color: var(--fg-mid); color: var(--fg-mid); }

    /* ── Mobile nav ───────────────────────────────────── */
    .mobile-nav {
      display: none;
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--rule);
      padding: 14px 20px;
      align-items: center;
      justify-content: space-between;
    }

    .mobile-brand { font-family: var(--font-display); font-size: 20px; font-weight: 500; color: var(--fg); }

    .mobile-menu-btn {
      background: none; border: none; color: var(--fg-mid);
      cursor: pointer; padding: 4px; display: flex; align-items: center;
    }

    .mobile-menu {
      display: none; flex-direction: column;
      background: var(--surface); border-bottom: 1px solid var(--rule);
      padding: 4px 20px 16px;
    }
    .mobile-menu.open { display: flex; }

    .mobile-menu a {
      display: block; padding: 10px 0;
      font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--fg-muted); text-decoration: none;
      border-bottom: 1px solid var(--rule);
    }
    .mobile-menu a:last-child { border-bottom: none; }
    .mobile-menu a:hover { color: var(--accent); }

    /* ── Main ─────────────────────────────────────────── */
    .main { flex: 1; min-width: 0; padding: 72px 68px 100px; max-width: 860px; }

    /* ── Sections ─────────────────────────────────────── */
    section { margin-bottom: 88px; scroll-margin-top: 32px; }
    section:last-child { margin-bottom: 0; }

    .section-label {
      font-size: 10px; font-weight: 400; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--fg-muted); margin-bottom: 32px;
      display: flex; align-items: center; gap: 14px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--rule); }

    /* ── About ────────────────────────────────────────── */
    .about-grid { display: grid; grid-template-columns: 112px 1fr; gap: 40px; align-items: start; }

    .photo-wrap {
      width: 112px; height: 140px; border-radius: 3px; overflow: hidden;
      flex-shrink: 0; border: 1px solid var(--rule); background: var(--accent-bg);
    }
    .photo-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .photo-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; color: var(--fg-muted); font-size: 10px;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .photo-placeholder svg { opacity: 0.35; }

    .about-name {
      font-family: var(--font-display); font-size: 48px; font-weight: 300;
      line-height: 1.08; text-wrap: balance; color: var(--fg); margin-bottom: 8px;
    }

    .about-position { font-size: 16px; color: var(--fg-muted); line-height: 1.65; margin-bottom: 24px; }

    .about-bio { font-size: 19px; line-height: 1.8; color: var(--fg-mid); max-width: 54ch; margin-bottom: 26px; }

    .about-links { display: flex; flex-wrap: wrap; gap: 8px; }

    .about-link {
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--fg-muted); text-decoration: none;
      border: 1px solid var(--rule); padding: 6px 13px; border-radius: 2px;
      transition: border-color 0.15s, color 0.15s;
    }
    .about-link:hover { border-color: var(--accent); color: var(--accent); text-decoration: none; }

    /* ── Research ─────────────────────────────────────── */
    .project-list { display: flex; flex-direction: column; }

    .project { padding: 32px 0; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 12px; }
    .project:first-child { border-top: 1px solid var(--rule); }

    .project-meta { display: flex; align-items: center; gap: 10px; }

    .project-tag {
      font-size: 10px; font-weight: 500; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--accent); background: var(--accent-bg); padding: 3px 8px; border-radius: 2px;
    }

    .project-status { font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg-muted); }

    .project h3 {
      font-family: var(--font-display); font-size: 26px; font-weight: 400;
      line-height: 1.25; text-wrap: balance; color: var(--fg);
    }

    .project p { font-size: 18px; line-height: 1.8; color: var(--fg-mid); max-width: 58ch; }

    .project-media { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }

    .media-placeholder {
      width: 196px; height: 138px; background: var(--accent-bg);
      border: 1px dashed var(--rule); border-radius: 3px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 10px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg-muted); gap: 8px;
    }
    .media-placeholder svg { opacity: 0.4; }

    /* ── Notes ────────────────────────────────────────── */
    .notes-list { display: flex; flex-direction: column; }

    .note-item {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 18px 0; border-bottom: 1px solid var(--rule); gap: 20px;
    }
    .note-item:first-child { border-top: 1px solid var(--rule); }

    .note-title {
      font-family: var(--font-display); font-size: 23px; font-weight: 400;
      color: var(--fg); text-decoration: none; transition: color 0.15s;
    }
    .note-title:hover { color: var(--accent); text-decoration: none; }

    .note-desc { font-size: 13px; color: var(--fg-muted); flex-shrink: 0; letter-spacing: 0.02em; }

    /* ── Publications ─────────────────────────────────── */
    .pub-list { display: flex; flex-direction: column; }

    .pub-item {
      padding: 24px 0; border-bottom: 1px solid var(--rule);
      display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: start;
    }
    .pub-item:first-child { border-top: 1px solid var(--rule); }

    .pub-year {
      font-family: var(--font-display); font-size: 14px; font-weight: 300;
      color: var(--fg-muted); padding-top: 3px; font-variant-numeric: tabular-nums;
    }

    .pub-title {
      font-family: var(--font-display); font-size: 20px; font-weight: 400;
      line-height: 1.35; color: var(--fg); margin-bottom: 5px; text-wrap: balance;
    }

    .pub-authors { font-size: 15px; color: var(--fg-muted); margin-bottom: 4px; line-height: 1.5; }
    .pub-journal { font-size: 15px; font-style: italic; color: var(--fg-mid); margin-bottom: 10px; }

    .pub-links { display: flex; gap: 8px; }

    .pub-link {
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--accent); text-decoration: none;
      border: 1px solid var(--accent); padding: 3px 9px; border-radius: 2px;
      transition: background 0.15s, color 0.15s;
    }
    .pub-link:hover { background: var(--accent); color: var(--surface); text-decoration: none; }

    /* ── Talks ────────────────────────────────────────── */
    .talk-list { display: flex; flex-direction: column; }

    .talk-item {
      padding: 22px 0; border-bottom: 1px solid var(--rule);
      display: grid; grid-template-columns: 48px 1fr; gap: 14px; align-items: start;
    }
    .talk-item:first-child { border-top: 1px solid var(--rule); }

    .talk-year {
      font-family: var(--font-display); font-size: 14px; font-weight: 300;
      color: var(--fg-muted); padding-top: 2px; font-variant-numeric: tabular-nums;
    }

    .talk-title {
      font-family: var(--font-display); font-size: 20px; font-weight: 400;
      line-height: 1.3; color: var(--fg); margin-bottom: 4px; text-wrap: balance;
    }

    .talk-venue { font-size: 14px; color: var(--fg-mid); margin-bottom: 2px; }
    .talk-location { font-size: 13px; color: var(--fg-muted); }

    .talk-type {
      display: inline-block; font-size: 10px; font-weight: 500; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--accent); background: var(--accent-bg);
      padding: 2px 7px; border-radius: 2px; margin-top: 6px;
    }

    /* ── Contact ──────────────────────────────────────── */
    .contact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }

    .contact-item { padding: 18px 20px; border: 1px solid var(--rule); border-radius: 3px; background: var(--surface); }

    .contact-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-muted); margin-bottom: 7px; }

    .contact-value { font-size: 15px; color: var(--fg); line-height: 1.55; }
    .contact-value a { color: var(--fg); text-decoration: none; }
    .contact-value a:hover { color: var(--accent); }

    /* ── Responsive ───────────────────────────────────── */
    @media (max-width: 760px) {
      .sidebar { display: none; }
      .mobile-nav { display: flex; }
      .main { padding: 36px 20px 64px; }
      .about-grid { grid-template-columns: 1fr; gap: 24px; }
      .photo-wrap { width: 112px; height: 140px; }
      .about-name { font-size: 36px; }
      .pub-item, .talk-item { grid-template-columns: 1fr; gap: 2px; }
      .pub-year, .talk-year { font-size: 12px; margin-bottom: 2px; }
    }

    @media (max-width: 500px) { .contact-grid { grid-template-columns: 1fr; } }

    @media (max-width: 960px) and (min-width: 761px) { .main { padding: 56px 40px 80px; } }


    /* ── Research images ──────────────────────────── */
    .project-img-wrap {
      width: 100%;
      max-width: 520px;
      aspect-ratio: 16 / 9;
      background: var(--accent-bg);
      border: 1px dashed var(--rule);
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 14px;
    }

    .project-img-hint {
      font-size: 11px;
      letter-spacing: 0.07em;
      color: var(--fg-muted);
      font-family: monospace;
    }

    .project-img {
      width: 100%;
      border-radius: 3px;
      display: block;
      margin-top: 14px;
      max-width: 520px;
    }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>

<!-- Mobile header -->
<div class="mobile-nav" id="mobile-nav">
  <span class="mobile-brand">Danqi Lang</span>
  <button class="mobile-menu-btn" id="menu-btn" aria-expanded="false" aria-label="Toggle navigation">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
      <line x1="3" y1="5" x2="17" y2="5"/>
      <line x1="3" y1="10" x2="17" y2="10"/>
      <line x1="3" y1="15" x2="17" y2="15"/>
    </svg>
  </button>
</div>
<div class="mobile-menu" id="mobile-menu" role="navigation" aria-label="Mobile navigation">
  <a href="#about">About</a>
  <a href="#research">Research</a>
  <a href="#notes">Notes</a>
  <a href="#publications">Publications</a>
  <a href="#talks">Talks</a>
  <a href="#contact">Contact</a>
</div>

<div class="shell">

  <!-- ── Sidebar ── -->
  <aside class="sidebar" role="complementary">
    <div class="sidebar-brand">
      <span class="brand-mark">∮</span>
      <div class="brand-name">Danqi<br>Lang</div>
      <div class="brand-title">Physicist · ESPCI Paris</div>
    </div>

    <nav role="navigation" aria-label="Page sections">
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#research">Research</a></li>
        <li><a href="#notes">Notes</a></li>
        <li><a href="#publications">Publications</a></li>
        <li><a href="#talks">Talks</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <button class="theme-toggle" id="theme-toggle">Light / Dark</button>
    </div>
  </aside>

  <!-- ── Main content ── -->
  <main class="main">
    {{ content }}
  </main>
</div>

<script>
  /* ── Theme toggle ─────────────────────────────────── */
  const root = document.documentElement;
  const themeBtn = document.getElementById('theme-toggle');

  try {
    const saved = localStorage.getItem('theme');
    if (saved) root.setAttribute('data-theme', saved);
  } catch(e) {}

  themeBtn.addEventListener('click', () => {
    const cur = root.getAttribute('data-theme');
    const next = (cur === 'dark') ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch(e) {}
  });

  /* ── Mobile menu ──────────────────────────────────── */
  const menuBtn    = document.getElementById('menu-btn');
  const mobileMenu = document.getElementById('mobile-menu');

  menuBtn.addEventListener('click', () => {
    const isOpen = mobileMenu.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', isOpen);
  });

  mobileMenu.querySelectorAll('a').forEach(a => {
    a.addEventListener('click', () => {
      mobileMenu.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    });
  });

  /* ── Active nav highlight on scroll ──────────────── */
  const sections = document.querySelectorAll('section[id]');
  const navLinks  = document.querySelectorAll('.sidebar nav a');

  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        navLinks.forEach(a => a.classList.remove('active'));
        const link = document.querySelector(
          `.sidebar nav a[href="#${entry.target.id}"]`
        );
        if (link) link.classList.add('active');
      }
    });
  }, { rootMargin: '-20% 0px -60% 0px' });

  sections.forEach(s => io.observe(s));
</script>

</body>
</html>
